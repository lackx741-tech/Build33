# Log rotation for the Blower stack (spec §14: log rotation).
# Install to /etc/logrotate.d/blower on the host, or run via cron inside a
# container that mounts the logs volume.
#
#   /etc/cron.daily/blower-logrotate:
#       /usr/sbin/logrotate /etc/logrotate.d/blower

/var/log/blower/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0640 blower blower
    sharedscripts
    postrotate
        # Signal nginx to reopen its log files when present.
        [ -f /var/run/nginx.pid ] && kill -USR1 "$(cat /var/run/nginx.pid)" 2>/dev/null || true
    endscript
}
