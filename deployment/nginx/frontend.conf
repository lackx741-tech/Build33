# SPA server block for the standalone frontend image. In the full stack the
# top-level nginx (deployment/nginx/nginx.conf) serves these assets instead.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
