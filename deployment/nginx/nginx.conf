# Top-level nginx configuration.
# Terminates TLS, serves the frontend build, and reverse-proxies the two
# backends:
#   /api/*        -> Node.js application API
#   /rpc/*        -> PHP RPC gateway
#   /ws           -> Node.js WebSocket hub

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Request limits and timeouts.
    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;
    send_timeout         30s;

    # Shared rate limit zones (defence in depth on top of app-level limits).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=20r/s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm;
    gzip_min_length 1024;

    upstream node_service {
        server node-service:3000;
        keepalive 32;
    }

    upstream php_service {
        server php-service:8080;
        keepalive 16;
    }

    upstream frontend_service {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Container/orchestrator liveness probe.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Redirect everything else to HTTPS in production.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Secure headers (helmet also sets these on API responses).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Frontend static assets, served by the dedicated frontend container.
        location / {
            proxy_pass http://frontend_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Node.js application API.
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://node_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # PHP RPC gateway.
        location /rpc/ {
            limit_req zone=rpc_limit burst=40 nodelay;
            rewrite ^/rpc/(.*)$ /$1 break;
            proxy_pass http://php_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # WebSocket hub (Node.js).
        location /ws {
            proxy_pass http://node_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
