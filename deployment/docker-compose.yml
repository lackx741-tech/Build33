# Paths in this file are resolved relative to deployment/ (the compose file
# location). Build contexts therefore point at the repository root via `..`.
name: blower

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blower}
      POSTGRES_DB: ${POSTGRES_DB:-blower}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blower} -d ${POSTGRES_DB:-blower}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [blower]

  node-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-blower}:${POSTGRES_PASSWORD:-blower}@postgres:5432/${POSTGRES_DB:-blower}
      PHP_API_URL: http://php-service:8080
    env_file:
      - path: ../backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["3000"]
    volumes:
      - ../logs/node:/app/logs
    networks: [blower]

  php-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.php
    restart: unless-stopped
    environment:
      PHP_ENV: production
      NODE_API_URL: http://node-service:3000
    env_file:
      - path: ../php/.env
        required: false
    expose: ["8080"]
    networks: [blower]

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    restart: unless-stopped
    expose: ["80"]
    networks: [blower]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [frontend, node-service, php-service]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/conf.d/proxy_params.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [blower]

volumes:
  postgres-data:

networks:
  blower:
    driver: bridge
